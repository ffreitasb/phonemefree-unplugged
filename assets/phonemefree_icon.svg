<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fundo terminal -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1a0d"/>
      <stop offset="100%" stop-color="#050a05"/>
    </radialGradient>

    <!-- Glow verde nos elementos intactos -->
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow mais intenso pra rasura -->
    <filter id="glowRed" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Noise texture overlay -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noiseOut"/>
      <feColorMatrix type="saturate" values="0" in="noiseOut" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Clip para conter o espectrograma no retângulo principal -->
    <clipPath id="specClip">
      <rect x="56" y="96" width="400" height="320" rx="4"/>
    </clipPath>

    <!-- Clip para a rasura (diagonal, larga) -->
    <clipPath id="tearClip">
      <polygon points="180,0 340,0 332,512 172,512"/>
    </clipPath>
  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Scanlines sutis -->
  <rect width="512" height="512" fill="none" stroke="#00ff4410" stroke-width="1"
        stroke-dasharray="1,3" opacity="0.4"/>

  <!-- ══════════════════════════════════════════
       ESPECTROGRAMA — LADO ESQUERDO (intacto)
       Barras verticais simulando bins de frequência
       ══════════════════════════════════════════ -->
  <g filter="url(#glowGreen)" clip-path="url(#specClip)">

    <!-- Eixo de tempo (horizontal) implícito pelas colunas de barras -->
    <!-- Coluna 1 -->
    <rect x="68"  y="310" width="7" height="106" fill="#00ff44" opacity="0.9"/>
    <rect x="68"  y="260" width="7" height="44"  fill="#00ff44" opacity="0.75"/>
    <rect x="68"  y="220" width="7" height="34"  fill="#00cc33" opacity="0.6"/>
    <rect x="68"  y="190" width="7" height="24"  fill="#009922" opacity="0.4"/>
    <rect x="68"  y="165" width="7" height="18"  fill="#006611" opacity="0.25"/>

    <!-- Coluna 2 -->
    <rect x="82"  y="295" width="7" height="121" fill="#00ff44" opacity="0.9"/>
    <rect x="82"  y="240" width="7" height="49"  fill="#00ff44" opacity="0.7"/>
    <rect x="82"  y="200" width="7" height="34"  fill="#00cc33" opacity="0.55"/>
    <rect x="82"  y="175" width="7" height="19"  fill="#009922" opacity="0.35"/>

    <!-- Coluna 3 -->
    <rect x="96"  y="320" width="7" height="96"  fill="#00ff44" opacity="0.9"/>
    <rect x="96"  y="275" width="7" height="39"  fill="#00ff44" opacity="0.72"/>
    <rect x="96"  y="235" width="7" height="34"  fill="#00cc33" opacity="0.58"/>
    <rect x="96"  y="210" width="7" height="19"  fill="#009922" opacity="0.38"/>
    <rect x="96"  y="188" width="7" height="16"  fill="#006611" opacity="0.22"/>

    <!-- Coluna 4 -->
    <rect x="110" y="285" width="7" height="131" fill="#00ff44" opacity="0.88"/>
    <rect x="110" y="230" width="7" height="49"  fill="#00ff44" opacity="0.68"/>
    <rect x="110" y="195" width="7" height="29"  fill="#00cc33" opacity="0.52"/>
    <rect x="110" y="172" width="7" height="17"  fill="#009922" opacity="0.32"/>

    <!-- Coluna 5 -->
    <rect x="124" y="300" width="7" height="116" fill="#00ff44" opacity="0.9"/>
    <rect x="124" y="248" width="7" height="46"  fill="#00ff44" opacity="0.71"/>
    <rect x="124" y="210" width="7" height="32"  fill="#00cc33" opacity="0.56"/>
    <rect x="124" y="186" width="7" height="18"  fill="#009922" opacity="0.36"/>

    <!-- Coluna 6 -->
    <rect x="138" y="290" width="7" height="126" fill="#00ff44" opacity="0.87"/>
    <rect x="138" y="238" width="7" height="46"  fill="#00ff44" opacity="0.67"/>
    <rect x="138" y="200" width="7" height="32"  fill="#00cc33" opacity="0.53"/>
    <rect x="138" y="178" width="7" height="16"  fill="#009922" opacity="0.33"/>

    <!-- Coluna 7 -->
    <rect x="152" y="308" width="7" height="108" fill="#00ff44" opacity="0.9"/>
    <rect x="152" y="256" width="7" height="46"  fill="#00ff44" opacity="0.73"/>
    <rect x="152" y="218" width="7" height="32"  fill="#00cc33" opacity="0.58"/>
    <rect x="152" y="196" width="7" height="16"  fill="#009922" opacity="0.37"/>

    <!-- Coluna 8 (última antes da rasura) -->
    <rect x="166" y="275" width="7" height="141" fill="#00ff44" opacity="0.85"/>
    <rect x="166" y="225" width="7" height="44"  fill="#00ff44" opacity="0.65"/>
    <rect x="166" y="190" width="7" height="29"  fill="#00cc33" opacity="0.50"/>
    <rect x="166" y="168" width="7" height="16"  fill="#009922" opacity="0.30"/>

  </g>

  <!-- ══════════════════════════════════════════
       RASURA CENTRAL — o corte no espectrograma
       Polígono diagonal com glitch/estática
       ══════════════════════════════════════════ -->

  <!-- Sombra/halo da rasura -->
  <polygon points="188,96 220,96 212,416 180,416"
           fill="#ff2200" opacity="0.08" filter="url(#glowRed)"/>
  <polygon points="292,96 324,96 316,416 284,416"
           fill="#ff2200" opacity="0.08" filter="url(#glowRed)"/>

  <!-- Corpo da rasura — estática/ruído representada por linhas horizontais fragmentadas -->
  <g clip-path="url(#tearClip)" filter="url(#glowRed)">

    <!-- Linhas de estática — fragmentadas e irregulares -->
    <line x1="175" y1="108" x2="335" y2="108" stroke="#ff3300" stroke-width="1.5" opacity="0.9"/>
    <line x1="178" y1="114" x2="290" y2="114" stroke="#ff4400" stroke-width="1"   opacity="0.6"/>
    <line x1="182" y1="120" x2="330" y2="120" stroke="#ff2200" stroke-width="2"   opacity="0.8"/>
    <line x1="176" y1="126" x2="310" y2="126" stroke="#ff5500" stroke-width="1"   opacity="0.5"/>

    <line x1="180" y1="140" x2="338" y2="140" stroke="#ff3300" stroke-width="1.5" opacity="0.85"/>
    <line x1="183" y1="147" x2="295" y2="147" stroke="#ff2200" stroke-width="1"   opacity="0.55"/>
    <line x1="177" y1="154" x2="325" y2="154" stroke="#ff4400" stroke-width="2.5" opacity="0.75"/>

    <line x1="181" y1="170" x2="340" y2="170" stroke="#ff2200" stroke-width="1"   opacity="0.9"/>
    <line x1="184" y1="177" x2="300" y2="177" stroke="#ff3300" stroke-width="1.5" opacity="0.6"/>
    <line x1="178" y1="184" x2="332" y2="184" stroke="#ff1100" stroke-width="3"   opacity="0.7"/>
    <line x1="182" y1="191" x2="288" y2="191" stroke="#ff4400" stroke-width="1"   opacity="0.5"/>

    <line x1="179" y1="205" x2="336" y2="205" stroke="#ff3300" stroke-width="2"   opacity="0.88"/>
    <line x1="183" y1="212" x2="298" y2="212" stroke="#ff2200" stroke-width="1"   opacity="0.58"/>
    <line x1="177" y1="219" x2="328" y2="219" stroke="#ff4400" stroke-width="1.5" opacity="0.72"/>
    <line x1="181" y1="226" x2="316" y2="226" stroke="#ff1100" stroke-width="1"   opacity="0.48"/>

    <line x1="180" y1="242" x2="338" y2="242" stroke="#ff2200" stroke-width="2.5" opacity="0.85"/>
    <line x1="184" y1="250" x2="294" y2="250" stroke="#ff3300" stroke-width="1"   opacity="0.55"/>
    <line x1="178" y1="258" x2="330" y2="258" stroke="#ff1100" stroke-width="2"   opacity="0.78"/>

    <line x1="182" y1="274" x2="336" y2="274" stroke="#ff3300" stroke-width="1.5" opacity="0.9"/>
    <line x1="185" y1="282" x2="300" y2="282" stroke="#ff2200" stroke-width="1"   opacity="0.6"/>
    <line x1="179" y1="290" x2="322" y2="290" stroke="#ff4400" stroke-width="3"   opacity="0.68"/>
    <line x1="183" y1="298" x2="286" y2="298" stroke="#ff1100" stroke-width="1"   opacity="0.45"/>

    <line x1="181" y1="314" x2="334" y2="314" stroke="#ff2200" stroke-width="2"   opacity="0.82"/>
    <line x1="184" y1="322" x2="296" y2="322" stroke="#ff3300" stroke-width="1"   opacity="0.52"/>
    <line x1="178" y1="330" x2="326" y2="330" stroke="#ff1100" stroke-width="1.5" opacity="0.74"/>

    <line x1="180" y1="346" x2="338" y2="346" stroke="#ff3300" stroke-width="2.5" opacity="0.88"/>
    <line x1="183" y1="354" x2="292" y2="354" stroke="#ff2200" stroke-width="1"   opacity="0.58"/>
    <line x1="177" y1="362" x2="320" y2="362" stroke="#ff4400" stroke-width="2"   opacity="0.7"/>

    <line x1="182" y1="378" x2="336" y2="378" stroke="#ff2200" stroke-width="1.5" opacity="0.86"/>
    <line x1="185" y1="386" x2="298" y2="386" stroke="#ff3300" stroke-width="1"   opacity="0.56"/>
    <line x1="179" y1="394" x2="324" y2="394" stroke="#ff1100" stroke-width="2"   opacity="0.76"/>
    <line x1="183" y1="402" x2="284" y2="402" stroke="#ff4400" stroke-width="1"   opacity="0.46"/>

    <!-- Alguns blocos sólidos de estática mais intensa (artefatos de glitch) -->
    <rect x="192" y="158" width="48" height="6"  fill="#ff3300" opacity="0.4"/>
    <rect x="230" y="230" width="62" height="4"  fill="#ff2200" opacity="0.35"/>
    <rect x="205" y="305" width="35" height="8"  fill="#ff4400" opacity="0.45"/>
    <rect x="260" y="188" width="28" height="5"  fill="#ff1100" opacity="0.3"/>
    <rect x="218" y="355" width="55" height="6"  fill="#ff3300" opacity="0.38"/>

  </g>

  <!-- Bordas da rasura — linhas irregulares simulando "rasgado" -->
  <polyline points="196,96 190,150 198,210 186,270 194,330 188,416"
            fill="none" stroke="#ff4400" stroke-width="2" opacity="0.9" filter="url(#glowRed)"
            stroke-linejoin="round"/>
  <polyline points="316,96 310,155 318,215 306,275 314,335 308,416"
            fill="none" stroke="#ff4400" stroke-width="2" opacity="0.9" filter="url(#glowRed)"
            stroke-linejoin="round"/>

  <!-- ══════════════════════════════════════════
       ESPECTROGRAMA — LADO DIREITO (intacto mas "diferente")
       Barras com altura levemente alterada (pós-processado)
       ══════════════════════════════════════════ -->
  <g filter="url(#glowGreen)" clip-path="url(#specClip)">

    <!-- Coluna 9 (primeira após rasura) -->
    <rect x="330" y="340" width="7" height="76"  fill="#00ff44" opacity="0.82"/>
    <rect x="330" y="295" width="7" height="39"  fill="#00ff44" opacity="0.62"/>
    <rect x="330" y="262" width="7" height="27"  fill="#00cc33" opacity="0.48"/>
    <rect x="330" y="242" width="7" height="14"  fill="#009922" opacity="0.28"/>

    <!-- Coluna 10 -->
    <rect x="344" y="325" width="7" height="91"  fill="#00ff44" opacity="0.85"/>
    <rect x="344" y="278" width="7" height="41"  fill="#00ff44" opacity="0.65"/>
    <rect x="344" y="244" width="7" height="28"  fill="#00cc33" opacity="0.50"/>
    <rect x="344" y="224" width="7" height="14"  fill="#009922" opacity="0.30"/>

    <!-- Coluna 11 -->
    <rect x="358" y="350" width="7" height="66"  fill="#00ff44" opacity="0.80"/>
    <rect x="358" y="308" width="7" height="36"  fill="#00ff44" opacity="0.60"/>
    <rect x="358" y="278" width="7" height="24"  fill="#00cc33" opacity="0.45"/>
    <rect x="358" y="258" width="7" height="14"  fill="#009922" opacity="0.26"/>

    <!-- Coluna 12 -->
    <rect x="372" y="330" width="7" height="86"  fill="#00ff44" opacity="0.83"/>
    <rect x="372" y="288" width="7" height="36"  fill="#00ff44" opacity="0.63"/>
    <rect x="372" y="255" width="7" height="27"  fill="#00cc33" opacity="0.47"/>
    <rect x="372" y="236" width="7" height="13"  fill="#009922" opacity="0.28"/>

    <!-- Coluna 13 -->
    <rect x="386" y="318" width="7" height="98"  fill="#00ff44" opacity="0.86"/>
    <rect x="386" y="270" width="7" height="42"  fill="#00ff44" opacity="0.66"/>
    <rect x="386" y="235" width="7" height="29"  fill="#00cc33" opacity="0.51"/>
    <rect x="386" y="215" width="7" height="14"  fill="#009922" opacity="0.31"/>

    <!-- Coluna 14 -->
    <rect x="400" y="342" width="7" height="74"  fill="#00ff44" opacity="0.81"/>
    <rect x="400" y="300" width="7" height="36"  fill="#00ff44" opacity="0.61"/>
    <rect x="400" y="268" width="7" height="26"  fill="#00cc33" opacity="0.46"/>
    <rect x="400" y="248" width="7" height="14"  fill="#009922" opacity="0.27"/>

    <!-- Coluna 15 -->
    <rect x="414" y="328" width="7" height="88"  fill="#00ff44" opacity="0.84"/>
    <rect x="414" y="282" width="7" height="40"  fill="#00ff44" opacity="0.64"/>
    <rect x="414" y="248" width="7" height="28"  fill="#00cc33" opacity="0.49"/>
    <rect x="414" y="228" width="7" height="14"  fill="#009922" opacity="0.29"/>

    <!-- Coluna 16 -->
    <rect x="428" y="345" width="7" height="71"  fill="#00ff44" opacity="0.79"/>
    <rect x="428" y="306" width="7" height="33"  fill="#00ff44" opacity="0.59"/>
    <rect x="428" y="276" width="7" height="24"  fill="#00cc33" opacity="0.44"/>
    <rect x="428" y="256" width="7" height="14"  fill="#009922" opacity="0.25"/>

    <!-- Coluna 17 (última) -->
    <rect x="442" y="335" width="7" height="81"  fill="#00ff44" opacity="0.82"/>
    <rect x="442" y="292" width="7" height="37"  fill="#00ff44" opacity="0.62"/>
    <rect x="442" y="258" width="7" height="28"  fill="#00cc33" opacity="0.47"/>
    <rect x="442" y="238" width="7" height="14"  fill="#009922" opacity="0.27"/>

  </g>

  <!-- ══════════════════════════════════════════
       BORDA DO FRAME — estilo terminal
       ══════════════════════════════════════════ -->
  <rect x="56" y="96" width="400" height="320" rx="4"
        fill="none" stroke="#00ff44" stroke-width="1.5" opacity="0.35"/>

  <!-- Cantos reforçados (corner bracket aesthetic) -->
  <path d="M56,120 L56,96 L80,96"   fill="none" stroke="#00ff44" stroke-width="2.5" opacity="0.7"/>
  <path d="M432,96 L456,96 L456,120" fill="none" stroke="#00ff44" stroke-width="2.5" opacity="0.7"/>
  <path d="M56,392 L56,416 L80,416"  fill="none" stroke="#00ff44" stroke-width="2.5" opacity="0.7"/>
  <path d="M432,416 L456,416 L456,392" fill="none" stroke="#00ff44" stroke-width="2.5" opacity="0.7"/>

  <!-- ══════════════════════════════════════════
       LABEL — "PhonemeFree" estilo terminal
       ══════════════════════════════════════════ -->
  <text x="256" y="470"
        font-family="'Courier New', Courier, monospace"
        font-size="22"
        font-weight="bold"
        letter-spacing="4"
        text-anchor="middle"
        fill="#00ff44"
        opacity="0.85"
        filter="url(#glowGreen)">PHONEMEFREE</text>

  <!-- Sublabel menor -->
  <text x="256" y="492"
        font-family="'Courier New', Courier, monospace"
        font-size="11"
        letter-spacing="2"
        text-anchor="middle"
        fill="#00aa33"
        opacity="0.55">voice · unlinked</text>

  <!-- Cursor piscando após o label (decorativo) -->
  <rect x="390" y="455" width="10" height="18" fill="#00ff44" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Linha de eixo X do espectrograma (base) -->
  <line x1="56" y1="416" x2="456" y2="416" stroke="#00ff44" stroke-width="1" opacity="0.2"/>

  <!-- Marcadores de frequência no eixo Y (lado esquerdo) -->
  <text x="50" y="120" font-family="'Courier New', monospace" font-size="9" fill="#00ff44" opacity="0.4" text-anchor="end">8k</text>
  <text x="50" y="200" font-family="'Courier New', monospace" font-size="9" fill="#00ff44" opacity="0.4" text-anchor="end">4k</text>
  <text x="50" y="300" font-family="'Courier New', monospace" font-size="9" fill="#00ff44" opacity="0.4" text-anchor="end">1k</text>
  <text x="50" y="416" font-family="'Courier New', monospace" font-size="9" fill="#00ff44" opacity="0.4" text-anchor="end">0</text>

  <!-- Label Hz -->
  <text x="38" y="260" font-family="'Courier New', monospace" font-size="9" fill="#00aa33" opacity="0.35"
        text-anchor="middle" transform="rotate(-90, 38, 260)">Hz</text>

</svg>
